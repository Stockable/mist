
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mist OS</title>
    <style>
        /* Reset margins and eliminate scrollbars */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .fullscreen-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <img class="fullscreen-image" src="https://raw.githubusercontent.com/Stockable/mist/refs/heads/main/mistossoon.png" alt="coming soon">

</body>
</html>
